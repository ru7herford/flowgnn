% Steady incompressible laminar flow past one obstacle (SU2 v8).
% Placeholders are filled in by scripts/data/make_data.py (Python str.format).

SOLVER= INC_NAVIER_STOKES
INC_DENSITY_INIT= {density}
INC_VELOCITY_INIT= ( {velocity}, 0.0, 0.0 )
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= {viscosity}

% Boundaries: uniform inflow, zero gauge pressure outflow, slip side walls,
% no-slip obstacle.
INC_INLET_TYPE= VELOCITY_INLET
MARKER_INLET= ( inlet, 0.0, {velocity}, 1.0, 0.0, 0.0 )
INC_OUTLET_TYPE= PRESSURE_OUTLET
MARKER_OUTLET= ( outlet, 0.0 )
MARKER_SYM= ( top, bottom )
MARKER_HEATFLUX= ( obstacle, 0.0 )
MARKER_MONITORING= ( obstacle )
REF_LENGTH= {reference_length}
REF_AREA= {reference_length}

% Second-order upwind (FDS + MUSCL), implicit pseudo-time stepping.
NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 50
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 20

ITER= {max_iterations}
CONV_FIELD= RMS_PRESSURE
CONV_RESIDUAL_MINVAL= {rms_pressure_log10}

MESH_FILENAME= solve.su2
OUTPUT_FILES= ( PARAVIEW )
VOLUME_FILENAME= flow
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF )
SCREEN_OUTPUT= ( INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, DRAG, LIFT )
SCREEN_WRT_FREQ_INNER= 100
